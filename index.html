<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gloss 是 DeepSeek Harness 的 PDF 文献阅读插件。在浏览器里试读示例论文，体验导入 PDF、划词翻译和章节定位。">
  <meta name="theme-color" content="#f3f7fc">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Gloss · PDF Paper Reader for DeepSeek Harness</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gloss · PDF 文献阅读">
  <meta property="og:description" content="在浏览器中体验导入 PDF、划词翻译和章节定位。">
  <meta property="og:image" content="https://hh1802-npu.github.io/Gloss-Paper-Reader/assets/hero.webp">
  <link rel="icon" href="./assets/gloss.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css">
  <script defer src="./assets/site.js?v=2"></script>
</head>
<body id="top">
  <a class="skip" href="#content">跳到内容</a>
  <svg class="optic-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="gloss-rim" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feImage href="./assets/nav-rim.png" width="100%" height="100%" preserveAspectRatio="none" result="rim"/>
        <feDisplacementMap in="SourceGraphic" in2="rim" scale="12" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>
  <header class="site-header">
    <nav class="site-nav glass-material" aria-label="Gloss 导航">
      <a class="nav-home" href="#top" aria-label="Gloss 首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M19.2 6.7a8.5 8.5 0 1 0 1.2 7.1v-1.6h-6.2" stroke-width="2.15" stroke-linejoin="round"/>
          <path d="M8.8 10h3.1M8.8 13.8h2" stroke-width="1.5" opacity=".54"/>
        </svg>
      </a>
      <div class="nav-links" data-at-top>
        <span class="nav-lens" aria-hidden="true"></span>
        <a href="#demo">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 4h6"/></svg>
          在线体验
        </a>
        <a href="#recording">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v14H4zM10 9l5 3-5 3z"/></svg>
          操作演示
        </a>
        <a href="#features">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13 5H5v15h15v-8M12 12l8-8 3 3-8 8-4 1z"/></svg>
          更多功能
        </a>
      </div>
    </nav>
  </header>

  <main id="content">
    <section class="hero" aria-labelledby="title">
      <div class="hero-copy wrap">
        <h1 id="title">沿着原文读论文。</h1>
        <p>Gloss 是 DeepSeek Harness 的 PDF 文献阅读插件。<br class="desktop-break">划词翻译、逐章精读，随时回到原文。</p>
        <div class="hero-actions">
          <a class="button primary" href="#demo">亲手试一页</a>
          <a class="text-link" href="#download">获取 Gloss <span aria-hidden="true">↘</span></a>
        </div>
      </div>
      <figure class="hero-image wrap" data-hero-image>
        <picture>
          <source media="(max-width: 470px)" srcset="./assets/hero-mobile.webp">
          <img src="./assets/hero.webp" width="1280" height="800" fetchpriority="high" alt="Gloss 阅读界面，左边显示示例论文原文和划词翻译浮窗，右边是论文阅读工具。">
        </picture>
      </figure>
    </section>

    <section class="demo" id="demo" data-scroll-scene aria-labelledby="demo-title">
      <div class="wrap">
        <div class="demo-intro">
          <h2 id="demo-title" data-reveal>试读一页。</h2>
          <p data-reveal>直接上手体验 Gloss。</p>
        </div>

        <div class="demo-stage" id="demo-stage" data-state="waiting" data-reveal>
          <div class="paper-tray">
            <div class="demo-paper" tabindex="0" role="group" aria-label="示例 PDF。拖进阅读器重演。用键盘时按空格提起，按向右或向下移入阅读器，再按空格放下。">
              <img src="./assets/sample-paper.webp" width="240" height="318" loading="lazy" draggable="false" alt="Reading with Source Links 首页">
            </div>
          </div>
          <div class="demo-window">
            <iframe id="demo-frame" aria-label="Gloss 插件交互演示" src="./demo/index.html?v=2" loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe>
            <div class="paper-drop-target" aria-hidden="true"></div>
          </div>
        </div>
        <span id="demo-status" class="visually-hidden" role="status"></span>
      </div>
    </section>

    <section class="recording" id="recording" data-scroll-scene aria-labelledby="recording-title">
      <div class="wrap">
        <div class="recording-intro">
          <h2 id="recording-title" data-reveal>看一次完整操作。</h2>
          <p data-reveal>从导入论文，到找到原文。</p>
        </div>

        <figure class="reel" data-reveal>
          <video id="walkthrough" controls playsinline preload="metadata" poster="./assets/reel-poster.webp" width="1280" height="800" aria-label="Gloss 导入 PDF、划词翻译、定位章节的连续录屏">
            <source src="./assets/gloss-walkthrough.mp4" type="video/mp4">
            <track kind="captions" src="./assets/gloss-walkthrough.vtt" srclang="zh-CN" label="简体中文" default>
            <p><a href="./assets/gloss-walkthrough.mp4">下载操作录屏</a></p>
          </video>
        </figure>
      </div>
    </section>

    <section class="features" id="features" data-scroll-scene aria-labelledby="features-title">
      <div class="wrap">
        <div class="demo-intro">
          <h2 id="features-title" data-reveal>从阅读到讨论。</h2>
        </div>
        <div class="feature-gallery">
          <figure class="feature-shot">
            <img src="./assets/feature-ideas.png" loading="lazy" alt="Gloss 想法页显示一条研究提问和示例 AI 回复。">
            <figcaption><h3>AI 讨论</h3><p>在「想法」里围绕当前论文提问。</p></figcaption>
          </figure>
          <figure class="feature-shot">
            <img src="./assets/feature-zotero.png" loading="lazy" alt="Zotero 导入界面，左侧选中示例论文，右侧预览 PDF 首页。">
            <figcaption><h3>Zotero 导入</h3><p>选中文献，预览附件再导入。</p></figcaption>
          </figure>
          <figure class="feature-shot">
            <img src="./assets/feature-lookup.png" loading="lazy" alt="Gloss 在线查找界面展示按题名查到的示例论文和下载 PDF 入口。">
            <figcaption><h3>文献检索</h3><p>用题名、DOI 或论文链接查找。</p></figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="download" id="download" data-scroll-scene aria-labelledby="download-title">
      <div class="wrap download-inner">
        <div class="setup-copy" data-reveal>
          <h2 id="download-title">让 DeepSeek <span>帮你操作。</span></h2>
          <p>复制提示词，发给 DeepSeek Harness。</p>
          <label class="setup-label" for="setup-prompt">配置提示词</label>
          <div class="setup-prompt glass-material">
            <textarea id="setup-prompt" rows="2" autocomplete="off" spellcheck="false">请帮我在 DeepSeek Harness 中配置 Gloss-Paper-Reader。
https://github.com/Hh1802-NPU/Gloss-Paper-Reader</textarea>
            <button id="copy-setup" type="button" disabled>复制</button>
          </div>
          <span id="copy-status" class="copy-status" role="status"></span>
        </div>
        <div class="platforms" data-reveal>
          <a href="https://github.com/Hh1802-NPU/Gloss-Paper-Reader/releases/download/v1.1.0/Gloss-1.1.0-macos-arm64.zip">
            <span><strong>macOS</strong><small>Apple Silicon</small></span>
            <span aria-hidden="true">↓</span>
          </a>
          <a href="https://github.com/Hh1802-NPU/Gloss-Paper-Reader/releases/download/v1.1.0/Gloss-1.1.0-windows-x64.zip">
            <span><strong>Windows</strong><small>x64</small></span>
            <span aria-hidden="true">↓</span>
          </a>
        </div>
        <a class="text-link" href="https://github.com/Hh1802-NPU/Gloss-Paper-Reader">GitHub 仓库 <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a class="brand" href="#top"><img src="./assets/gloss.svg" width="28" height="28" alt="">Gloss</a>
    </div>
  </footer>
</body>
</html>
